name: Create Product Ad Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Render video
        run: npm run build

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: Product-Advertisement-Video
          path: out/video.mp4
